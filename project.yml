name: FinanceBuddy
options:
  bundleIdPrefix: com.guillermorebolledo
  deploymentTarget:
    iOS: '17.0'
packages:
  FinanceBuddyCore:
    path: Core
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '12'
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_APP_INTENTS_METADATA_EXTRACTION: NO
targets:
  FinanceBuddy:
    type: application
    platform: iOS
    sources: [FinanceBuddy]
    entitlements:
      path: FinanceBuddy/FinanceBuddy.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: FinanceBuddyCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillermorebolledo.FinanceBuddy
  FinanceBuddyCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Core/Tests/FinanceBuddyCoreTests]
    dependencies:
      - package: FinanceBuddyCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.guillermorebolledo.FinanceBuddyCoreTests
  FinanceBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FinanceBuddyUITests]
    dependencies:
      - target: FinanceBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.guillermorebolledo.FinanceBuddyUITests
  FinanceBuddyViewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FinanceBuddyViewTests
      - FinanceBuddy/Dashboard/FinanceChartDescriptor.swift
      - FinanceBuddy/Dashboard/ChartDatum.swift
      - FinanceBuddy/Session/AppleSignInFlow.swift
    dependencies:
      - package: FinanceBuddyCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.guillermorebolledo.FinanceBuddyViewTests
schemes:
  FinanceBuddy:
    build:
      targets:
        FinanceBuddy: all
    test:
      targets: [FinanceBuddyCoreTests, FinanceBuddyViewTests, FinanceBuddyUITests]
